{% macro icon(name) -%}
<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
{%- if name == 'dashboard' %}<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>
{%- elif name == 'orders' %}<path d="M6 3h12l2 4v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7z"/><path d="M4 7h16"/><path d="M9 11.5c.6 1 1.6 1.5 3 1.5s2.4-.5 3-1.5"/>
{%- elif name == 'calculator' %}<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8.5 12h.01M12 12h.01M15.5 12h.01M8.5 16h.01M12 16h.01M15.5 16h.01"/>
{%- elif name == 'customers' %}<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14.2A5 5 0 0 1 21.5 19"/>
{%- elif name == 'inventory' %}<path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>
{%- elif name == 'reports' %}<path d="M4 4v16h16"/><path d="M8 16v-5M12 16V7M16 16v-3M20 16v-8"/>
{%- elif name == 'sun' %}<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
{%- elif name == 'moon' %}<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
{%- elif name == 'menu' %}<path d="M4 6h16M4 12h16M4 18h16"/>
{%- elif name == 'search' %}<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/>
{%- elif name == 'print' %}<path d="M7 9V3h10v6"/><rect x="4" y="9" width="16" height="8" rx="2"/><path d="M7 14h10v7H7z"/>
{%- elif name == 'plus' %}<path d="M12 5v14M5 12h14"/>
{%- elif name == 'x' %}<path d="M6 6l12 12M18 6L6 18"/>
{%- endif -%}
</svg>
{%- endmacro %}

{% macro badge(text, tone=None) -%}
<span class="badge badge-{{ tone or (text | tone) }}">{{ text }}</span>
{%- endmacro %}

{% macro head(eyebrow, title, lead='') -%}
<div class="page-head">
  <div>
    <div class="eyebrow">{{ eyebrow }}</div>
    <h1>{{ title }}</h1>
    {% if lead %}<p>{{ lead }}</p>{% endif %}
  </div>
  <div class="page-actions">{{ caller() if caller else '' }}</div>
</div>
{%- endmacro %}
